name: Release

# 把「解压即用」的 skill zip 挂到 Release 附件上。
# Release 不存在时会自动创建（0.x 一律标为 pre-release）。
#
# 触发方式三选一：
#   1. 推 tag（形如 v0.2.0）—— 自动打附件
#   2. 在网页上点 Publish release —— 自动打附件
#   3. Actions 页手动 Run workflow（填一个**已存在**的 tag 名）
#
# 版本号规范见 CHANGELOG.md 开头：tag 是唯一版本来源，0.x 一律 pre-release。

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要挂附件的 tag —— 必须已存在，例如 v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 解析 tag 与版本号
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG  version=${TAG#v}"

      # 只导出被 git 跟踪的文件，所以不会混进 .git / .github / __pycache__；
      # 从对象库导出，换行符天然是 LF。
      - name: 打包（解压即用的 skill zip）
        run: |
          git archive --format=zip \
            --prefix=obsidian-note-ingest/ \
            -o "obsidian-note-ingest-${{ steps.v.outputs.ver }}.zip" \
            "${{ steps.v.outputs.tag }}" \
            SKILL.md README.md CHANGELOG.md LICENSE requirements.txt \
            scripts references tests

      - name: 确保 Release 存在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1 \
            || gh release create "${{ steps.v.outputs.tag }}" \
                 --title "${{ steps.v.outputs.ver }}" \
                 --generate-notes --prerelease

      - name: 上传附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.v.outputs.tag }}" \
            "obsidian-note-ingest-${{ steps.v.outputs.ver }}.zip" --clobber

      # CHANGELOG 里每个版本都有成稿的中文说明，直接取对应小节当 Release 描述，
      # 不用 GitHub 自动生成的英文提交列表
      - name: 用 CHANGELOG 对应小节写 Release 说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.v.outputs.ver }}"
          awk -v VER="$VER" '
            index($0, "## [" VER "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > body.md
          if [ -s body.md ]; then
            {
              echo '> ⚠️ **pre-release** —— 0.x 表示尚未稳定，接口与文件结构可能变动。'
              echo ''
              echo '安装：`npx skills add Woo3aN/obsidian-note-ingest`（或见 README 的三种方式）'
              echo ''
              cat body.md
            } > release-notes.md
            gh release edit "${{ steps.v.outputs.tag }}" --notes-file release-notes.md
          else
            echo "CHANGELOG 里没有 [${VER}] 小节，保留自动生成的说明"
          fi

      - name: 结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ steps.v.outputs.tag }}"
